# Production stack. Configuration comes from a .env file sitting next to this
# file on the server; it is never shipped from the repository.
# Required: DB_PASSWORD, JWT_SECRET, CORS_ORIGINS.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-criterium}
    # Not published to the host: only the backend on the compose network
    # needs to reach Postgres.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - criterium-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    image: ghcr.io/mdportnov/criterium-backend:latest
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_NAME: ${DB_NAME:-criterium}
      # At least 32 characters. The API refuses to start without it, which is
      # the point: the previous stack passed an unset variable through and the
      # API happily signed tokens with an empty secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME:-1d}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set in .env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY must be set in .env}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - criterium-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: ghcr.io/mdportnov/criterium-frontend:latest
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - criterium-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  criterium-network:
    driver: bridge
