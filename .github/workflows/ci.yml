name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

concurrency:
  # github.workflow is the caller's name when this is reached through
  # workflow_call, so CI, Deploy Backend and Deploy Frontend each get their own
  # group. Without it all three shared one and cancelled each other on a single
  # push to master.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci, not `rm -rf package-lock.json && npm install`: the deploy
      # workflows used to resolve a fresh dependency tree on every run, so
      # what shipped was never what anyone tested.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:all

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:all

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  # The images were only ever built during a deploy, so a Dockerfile mistake
  # surfaced after a merge rather than on the pull request that caused it.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend.Dockerfile
          push: false
          load: true
          tags: criterium-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend.Dockerfile
          push: false
          load: true
          tags: criterium-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that carries a credential is a leak the moment it is pushed.
      - name: Assert the backend image carries no secrets
        run: |
          env_vars=$(docker image inspect criterium-backend:ci --format '{{json .Config.Env}}')
          echo "$env_vars"
          if echo "$env_vars" | grep -Eiq '(SECRET|PASSWORD|API_KEY|TOKEN)='; then
            echo "::error::The backend image has a credential baked into its environment"
            exit 1
          fi
