name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci, not `rm -rf package-lock.json && npm install`: the deploy
      # workflows used to resolve a fresh dependency tree on every run, so
      # what shipped was never what anyone tested.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:all

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:all

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
