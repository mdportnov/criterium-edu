name: Deploy Backend

on:
  push:
    branches: [ master ]
    paths:
      - 'apps/api/**'
      - 'libs/**'
      - 'nx.json'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      packages: write

    env:
      IMAGE_NAME: criterium-backend
      REGISTRY: ghcr.io

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v5

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and push Backend Docker image"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: "Copy deployment files to server"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          passphrase: ${{ secrets.PASSPHRASE }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,start.sh"
          target: "~/criterium/"

      - name: "Deploy to server"
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          passphrase: ${{ secrets.PASSPHRASE }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            sudo mkdir -p /var/www/criterium
            sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /var/www/criterium

            cp -f ~/criterium/docker-compose.yml /var/www/criterium/docker-compose.yml
            cp -f ~/criterium/start.sh /var/www/criterium/

            cd /var/www/criterium

            # The runtime environment lives in /var/www/criterium/.env on the
            # server and is never shipped from the repository. Fail loudly
            # rather than start the API with an empty JWT_SECRET.
            test -f .env || { echo "::error::/var/www/criterium/.env is missing"; exit 1; }

            mkdir -p ./data/pg
            chmod 700 ./data ./data/pg
            chmod +x start.sh

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull backend
            docker compose up -d postgres backend
            docker compose ps

            # Only reclaim dangling layers; -a would delete images other
            # stacks on this host still need.
            docker image prune -f
