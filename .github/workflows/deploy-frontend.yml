name: Deploy Frontend

on:
  push:
    branches: [master]
    paths:
      # This used to read '../../apps/web/**', which matches nothing, so a
      # frontend-only change never deployed.
      - 'apps/web/**'
      - 'apps/nginx/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend.Dockerfile'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      packages: write

    env:
      IMAGE_NAME: criterium-frontend
      REGISTRY: ghcr.io

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v5

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and push Frontend Docker image"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            # Relative: nginx in this image proxies /api to the backend on the
            # same origin, so the bundle needs no absolute API URL.
            VITE_API_URL=/api/v1

      - name: "Copy deployment files to server"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          passphrase: ${{ secrets.PASSPHRASE }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,apps/nginx/nginx.conf"
          target: "~/criterium/"

      - name: "Deploy to server"
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          passphrase: ${{ secrets.PASSPHRASE }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            sudo mkdir -p /var/www/criterium/apps/nginx
            sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /var/www/criterium

            cp -f ~/criterium/docker-compose.yml /var/www/criterium/
            cp -f ~/criterium/apps/nginx/nginx.conf /var/www/criterium/apps/nginx/

            cd /var/www/criterium
            test -f .env || { echo "::error::/var/www/criterium/.env is missing"; exit 1; }

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull frontend
            docker compose up -d frontend
            docker compose ps

            docker image prune -f
