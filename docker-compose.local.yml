# Local development: Postgres in Docker, apps on the host.
#   docker compose -f docker-compose.local.yml up -d
#   npm run api:serve
#   npm run web:serve

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-criterium}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - criterium_pg_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  criterium_pg_local:
